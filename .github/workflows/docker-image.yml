name: CI — Build, Test, Push

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  IMAGE_NAME: automationdocker
  TAG: latest
  REPORT_PATH: reports/report.html

jobs:
  build_test_push:
    runs-on: ubuntu-latest
    env:
      FULL_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login (Docker Hub)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.FULL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests in Docker and collect report
        run: |
          mkdir -p reports
          docker run --rm -e HEADLESS=1 -v "$PWD/reports:/reports" ${{ env.FULL_IMAGE }}
          test -f ${{ env.REPORT_PATH }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: docker-report
          path: ${{ env.REPORT_PATH }}
