name: CI - Build Image, Run K8s Tests, Upload Report

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPO: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/automationdocker
      IMAGE_TAG: ${{ github.sha }}
      FULL_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/automationdocker:${{ github.sha }}
      NAMESPACE: qa-tests
      JOB_NAME: web-tests
      REPORT_PATH: /reports/report.html

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build & push the Docker image with a unique tag for this commit
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image (latest + sha)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:latest
            ${{ env.FULL_IMAGE }}

      # Spin up a temporary Kubernetes cluster inside the runner
      - name: Create KinD cluster
        uses: helm/kind-action@v1
        with:
          version: v0.23.0

      - name: kubectl version
        run: kubectl version --client && kubectl get nodes

      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Apply namespace (idempotent)
        run: kubectl create namespace qa-tests --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Job
        run: |
          # if you need envsubst, do:
          # envsubst < k8s/job-web-tests.yaml | kubectl apply -f -
          kubectl apply -f k8s/job-web-tests.yaml
      
      - name: Wait for pod to be Running
        shell: bash
        run: |
          for i in {1..60}; do
            POD=$(kubectl get pods -n qa-tests -l job-name=web-tests -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            [ -n "$POD" ] || { echo "Pod not created yet"; sleep 5; continue; }
            PHASE=$(kubectl get pod -n qa-tests "$POD" -o jsonpath='{.status.phase}' 2>/dev/null || true)
            echo "Pod=$POD Phase=$PHASE"
            [ "$PHASE" = "Running" ] && break
            sleep 5
          done
          [ -z "$POD" ] && { echo "No pod found"; exit 1; }
          echo "POD=$POD" >> $GITHUB_ENV
      
      - name: Copy report while pod is alive
        shell: bash
        run: |
          # try a few times during the 60s sleep window
          for i in {1..6}; do
            if kubectl cp -n qa-tests "${POD}:/reports/report.html" "./report.html"; then
              echo "Report copied."
              exit 0
            fi
            echo "Report not ready yet, retrying..."
            sleep 10
          done
          echo "Failed to copy report before pod completed."
          exit 1
      
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: html-report-${{ github.sha }}
          path: ./report.html
      
      # (Optional) now wait for completion, or just clean up
      - name: Wait for completion (longer timeout just in case)
        run: kubectl wait --for=condition=complete job/web-tests -n qa-tests --timeout=1800s
      
      - name: Debug on failure
        if: failure()
        run: |
          kubectl -n qa-tests get jobs,pods,events
          echo "---- DESCRIBE JOB ----"
          kubectl -n qa-tests describe job/web-tests || true
          echo "---- DESCRIBE POD ----"
          kubectl -n qa-tests describe pod "$POD" || true
          echo "---- LOGS (tail) ----"
          kubectl -n qa-tests logs "$POD" --tail=200 || true


