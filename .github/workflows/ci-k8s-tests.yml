name: CI - Build Image, Run K8s Tests, Upload Report

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPO: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/automationdocker
      IMAGE_TAG: ${{ github.sha }}
      FULL_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/automationdocker:${{ github.sha }}
      NAMESPACE: qa-tests
      JOB_NAME: web-tests
      REPORT_PATH: /reports/report.html

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build & push the Docker image with a unique tag for this commit
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image (latest + sha)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:latest
            ${{ env.FULL_IMAGE }}

      # Spin up a temporary Kubernetes cluster inside the runner
      - name: Create KinD cluster
        uses: helm/kind-action@v1
        with:
          version: v0.23.0

      - name: kubectl version
        run: kubectl version --client && kubectl get nodes

      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Apply namespace (idempotent)
        run: kubectl create namespace qa-tests --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Job
        run: |
          # If your manifest has ${DOCKERHUB_USERNAME} / ${GITHUB_SHA}, expand them:
          export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          export GITHUB_SHA=${{ github.sha }}
          envsubst < k8s/job-web-tests.yaml | kubectl apply -f -
      
      - name: Wait for completion (extend timeout if needed)
        run: kubectl wait --for=condition=complete job/web-tests -n qa-tests --timeout=1800s
      
      - name: Get pod name
        id: pod
        shell: bash
        run: |
          POD=$(kubectl get pods -n qa-tests -l job-name=web-tests -o jsonpath='{.items[0].metadata.name}')
          echo "pod=$POD" >> "$GITHUB_OUTPUT"
      
      - name: Reconstruct HTML report from logs
        shell: bash
        run: |
          LINE=$(kubectl logs -n qa-tests "${{ steps.pod.outputs.pod }}" | grep '^REPORT_B64=' | tail -n1 || true)
          if [ -z "$LINE" ]; then
            echo "No REPORT_B64 line found in logs"; exit 1
          fi
          B64=${LINE#REPORT_B64=}
          echo "$B64" | base64 -d > report.html
          test -s report.html && echo "Report reconstructed (size: $(wc -c < report.html) bytes)."
      
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: html-report-${{ github.sha }}
          path: ./report.html
      
      # Helpful debug if anything fails
      - name: Debug on failure
        if: failure()
        run: |
          kubectl -n qa-tests get jobs,pods,events
          echo "---- DESCRIBE JOB ----"
          kubectl -n qa-tests describe job/web-tests || true
          echo "---- LOGS (tail) ----"
          kubectl -n qa-tests logs "${{ steps.pod.outputs.pod }}" --tail=200 || true



