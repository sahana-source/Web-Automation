name: CI - Build Image, Run K8s Tests, Upload Report

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPO: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/automationdocker
      IMAGE_TAG: ${{ github.sha }}
      FULL_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/automationdocker:${{ github.sha }}
      NAMESPACE: qa-tests
      JOB_NAME: web-tests
      REPORT_PATH: /reports/report.html

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build & push the Docker image with a unique tag for this commit
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image (latest + sha)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:latest
            ${{ env.FULL_IMAGE }}

      # Spin up a temporary Kubernetes cluster inside the runner
      - name: Create KinD cluster
        uses: helm/kind-action@v1
        with:
          version: v0.23.0

      - name: kubectl version
        run: kubectl version --client && kubectl get nodes

      # Create namespace & PVC
      - name: Create namespace
        run: kubectl create namespace qa-tests --dry-run=client -o yaml | kubectl apply -f -
      
      - name: Apply PVC
        run: kubectl apply -f k8s/reports-pvc.yaml
      
      # Run the Job
      - name: Apply test Job
        run: kubectl apply -f k8s/job-web-tests.yaml
      
      - name: Wait for completion
        run: kubectl wait --for=condition=complete job/web-tests -n qa-tests --timeout=900s
      
      # Start a tiny helper pod that mounts the same PVC
      - name: Start helper pod (PVC reader)
        run: |
          kubectl run pvc-reader -n qa-tests --image=alpine --restart=Never --overrides '
          {
            "apiVersion":"v1",
            "spec":{
              "containers":[
                {
                  "name":"alpine",
                  "image":"alpine",
                  "command":["sleep","3600"],
                  "volumeMounts":[{"name":"reports","mountPath":"/reports"}]
                }
              ],
              "volumes":[{"name":"reports","persistentVolumeClaim":{"claimName":"reports-pvc"}}]
            }
          }'
          kubectl wait --for=condition=Ready pod/pvc-reader -n qa-tests --timeout=120s
      
      # Now copy from the helper pod (it's running)
      - name: Copy HTML report from helper pod
        run: |
          kubectl cp -n qa-tests "pvc-reader:/reports/report.html" "./report.html"
          test -s report.html && echo "Report copied."
      
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: html-report-${{ github.sha }}
          path: ./report.html
      
      # Cleanup helper
      - name: Cleanup helper pod
        if: always()
        run: kubectl delete pod pvc-reader -n qa-tests --ignore-not-found

