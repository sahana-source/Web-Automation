apiVersion: batch/v1
kind: Job
metadata:
  name: web-tests
  namespace: qa-tests
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 60
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: web-tests
          image: docker.io/${DOCKERHUB_USERNAME}/automationdocker:${GITHUB_SHA}
          imagePullPolicy: IfNotPresent
          env:
            - name: HEADLESS
              value: "1"
          volumeMounts:
            - name: reports
              mountPath: /reports
          args:
            - sh
            - -c
            - |
              set -e
              pytest -v --html=/reports/report.html --self-contained-html
              echo "Encoding report to base64 for CI artifact..."
              python - <<'PY'
              import base64, pathlib
              p = pathlib.Path('/reports/report.html')
              if p.exists():
                  b64 = base64.b64encode(p.read_bytes()).decode('ascii')
                  print('REPORT_B64=' + b64)
              else:
                  print('NO_REPORT')
              PY
      volumes:
        - name: reports
          emptyDir: {}
