apiVersion: batch/v1
kind: Job
metadata:
  name: web-tests
  namespace: qa-tests
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 60
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: web-tests
          image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/automationdocker:${{ github.sha }}
          imagePullPolicy: IfNotPresent   # or Always if you want to force-pull
          env:
            - name: HEADLESS
              value: "1"
          args:
            - sh
            - -c
            - >
              pytest -v --html=/reports/report.html --self-contained-html;
              EXIT=$?;
              echo "REPORT_FILE=/reports/report.html";
              # keep container alive briefly so CI can kubectl cp
              sleep 60;
              exit $EXIT
          volumeMounts:
            - name: reports
              mountPath: /reports
      volumes:
        - name: reports
          emptyDir: {}
